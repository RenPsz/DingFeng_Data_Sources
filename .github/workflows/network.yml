name: Live data source integration

on:
  workflow_dispatch:
  schedule:
    - cron: "23 22 * * 0"

permissions:
  contents: read

concurrency:
  group: live-data-sources
  cancel-in-progress: true

jobs:
  network-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev,baostock]"
      - name: Controlled real-network integration tests
        run: python -m pytest -m network -ra --maxfail=3 --junitxml=junit-network.xml
      - name: Upload live test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-network
          path: junit-network.xml
          if-no-files-found: error
