name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check cnfin.py tests
      - name: Verify offline suite before release
        run: python -m pytest -m "not network" --cov=cnfin --cov-branch --cov-fail-under=70
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify version matches tag
        env:
          TAG: ${{ github.ref_name }}
        run: python -c "import os, cnfin; assert os.environ['TAG'] == 'v' + cnfin.__version__, (os.environ['TAG'], cnfin.__version__)"
      - name: Install released wheel in clean environment
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install dist/*.whl
          .release-smoke/bin/python -c "import cnfin; print(cnfin.__version__)"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            cnfin.py
          fail_on_unmatched_files: true
          generate_release_notes: true
